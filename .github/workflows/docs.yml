name: Deploy API docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'typedoc.public.json'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx typedoc --options typedoc.public.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api_docs/public
      - uses: actions/deploy-pages@v4
        id: deploy
